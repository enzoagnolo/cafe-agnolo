<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Caffe Dell'Agnolo</title>
  <style>
    :root{--ink:#17201c;--paper:#f5f1e9;--cream:#e9e0d2;--moss:#26352c;--clay:#bd7153;--muted:#687069;--serif:Georgia,serif;--sans:Arial,sans-serif;--mono:monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans)}button,input{font:inherit}button{cursor:pointer}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--moss)}.login-card,.dashboard{width:min(1100px,100%);margin:auto}.login-card{max-width:430px;padding:42px;background:var(--paper);box-shadow:0 18px 60px #0004}.eyebrow,.label{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--clay)}h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.04em}h1{font-size:46px;line-height:1;margin:18px 0}h2{font-size:30px}.muted{color:var(--muted)}label{display:grid;gap:7px;margin:18px 0;font-size:12px;font-weight:bold}input{width:100%;border:0;border-bottom:1px solid #17201c55;background:transparent;padding:10px 0;outline:0}input:focus{border-color:var(--ink)}.button{border:0;background:var(--ink);color:#fff;padding:14px 18px;font-weight:bold;text-transform:uppercase;font-size:11px;letter-spacing:.05em}.login-card .button{width:100%;margin-top:12px}.error{min-height:22px;color:#a43f2e;font-size:12px}.dashboard{padding:38px 24px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #17201c33;padding-bottom:22px}.topbar h1{font-size:40px;margin:7px 0 0}.logout{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-size:11px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0}.stat{padding:18px;background:var(--cream)}.stat strong{display:block;margin-top:8px;font:32px var(--serif)}.orders{display:grid;gap:12px}.order{padding:22px;background:#fff;border-left:3px solid var(--clay)}.order-head{display:flex;justify-content:space-between;gap:20px}.order h3{margin:0;font:22px var(--serif)}.order-meta{color:var(--muted);font-size:12px}.order table{width:100%;border-collapse:collapse;margin-top:17px;font-size:12px}.order td{padding:8px 0;border-top:1px solid #17201c22}.order td:last-child{text-align:right}.status{border:0;background:var(--cream);padding:8px;font-size:11px}.proof{display:inline-block;margin-top:14px;color:var(--ink);font-size:12px;font-weight:bold}.empty{padding:40px 0;color:var(--muted)}@media(max-width:650px){.dashboard{padding:25px 16px}.topbar{align-items:flex-start}.topbar h1{font-size:32px}.stats{grid-template-columns:1fr}.order-head{display:block}.order-head .status{margin-top:12px}}
  </style>
  <style>
    .tabs{display:flex;gap:8px;margin:30px 0 22px;border-bottom:1px solid #17201c33}.tab-button{border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 14px;color:var(--muted);font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em}.tab-button.active{border-color:var(--clay);color:var(--ink)}.tab-panel[hidden]{display:none}.finance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}.finance-grid .stat{background:var(--moss);color:var(--paper)}.finance-grid .stat .label{color:var(--clay)}.finance-note{color:var(--muted);font-size:12px}.panel-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:30px 0 18px}.panel-title h2{margin:0}.product-form{display:grid;grid-template-columns:1.3fr .6fr .7fr 1fr auto;gap:10px;align-items:end;padding:18px;background:var(--cream);margin-bottom:20px}.product-form label{margin:0}.product-table{width:100%;border-collapse:collapse;background:#fff}.product-table th,.product-table td{padding:12px;text-align:left;border-bottom:1px solid #17201c22;font-size:12px}.product-table th{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.product-table input{padding:7px 0}.product-actions{display:flex;gap:7px}.product-action{border:1px solid var(--ink);background:transparent;padding:8px;font-size:10px;font-weight:bold;text-transform:uppercase}.product-action.delete{border-color:#a43f2e;color:#a43f2e}.product-image-input{min-width:130px}@media(max-width:750px){.finance-grid{grid-template-columns:1fr}.product-form{grid-template-columns:1fr 1fr}.product-form label:first-child,.product-form label:last-of-type{grid-column:span 2}.product-table{display:block;overflow-x:auto;white-space:nowrap}.panel-title{display:block}.panel-title .muted{margin-top:8px}}
    .customer-card{padding:22px;background:#fff;border-left:3px solid var(--clay);margin-bottom:12px}.customer-card-head{display:flex;justify-content:space-between;gap:20px}.customer-card h3{margin:0 0 6px;font:22px var(--serif)}.customer-summary{display:flex;gap:24px;margin-top:18px;padding-top:14px;border-top:1px solid #17201c22;color:var(--muted);font-size:12px}.customer-summary b{color:var(--ink);font-size:16px}@media(max-width:750px){.customer-card-head{display:block}.customer-delete{margin-top:16px}.customer-summary{display:grid;gap:6px}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    if (location.port === '5500') location.replace('http://localhost:3000/admin?login=1');
    const app = document.querySelector('#app');
    const esc = value => String(value ?? '').replace(/[&<>\"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
    const money = value => Number(value || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    async function request(url, options) { const response = await fetch(url, options); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Nao foi possivel concluir a operacao.'); return response.json(); }
    function renderLogin(message = '') { app.innerHTML = `<main class="login-page"><form class="login-card" id="loginForm"><p class="eyebrow">Area restrita</p><h1>Bem-vindo<br>de volta.</h1><p class="muted">Acesso exclusivo para a equipe Caffe Dell'Agnolo.</p><label>E-mail<input type="email" name="email" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><p class="error">${esc(message)}</p><button class="button" type="submit">Entrar no painel</button></form></main>`; document.querySelector('#loginForm').addEventListener('submit', login); }
    async function login(event) { event.preventDefault(); const form = new FormData(event.currentTarget); try { await request('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))}); renderDashboard(); } catch (error) { renderLogin(error.message); } }
    function renderDashboard() { app.innerHTML = `<main class="dashboard"><header class="topbar"><div><p class="eyebrow">Painel privado</p><h1>Pedidos recebidos</h1></div><button class="logout" id="logout">Sair</button></header><section class="stats"><div class="stat"><span class="label">Pedidos</span><strong id="totalOrders">-</strong></div><div class="stat"><span class="label">Pendentes</span><strong id="pendingOrders">-</strong></div><div class="stat"><span class="label">Faturamento</span><strong id="revenue">-</strong></div></section><section><h2>Ultimos pedidos</h2><div class="orders" id="orders"><p class="empty">Carregando pedidos...</p></div></section></main>`; document.querySelector('#logout').addEventListener('click', logout); loadOrders(); }
    async function loadOrders() { try { const data = await request('/admin/api/orders'); document.querySelector('#totalOrders').textContent = data.stats.total; document.querySelector('#pendingOrders').textContent = data.stats.pending; document.querySelector('#revenue').textContent = money(data.stats.revenue); document.querySelector('#orders').innerHTML = data.orders.length ? data.orders.map(renderOrder).join('') : '<p class="empty">Ainda nao ha pedidos.</p>'; document.querySelectorAll('.status').forEach(select => select.addEventListener('change', updateStatus)); } catch (error) { if (error.message === 'AUTH_REQUIRED') renderLogin('Sua sessao expirou.'); else document.querySelector('#orders').innerHTML = `<p class="error">${esc(error.message)}</p>`; } }
    function renderOrder(order) { return `<article class="order"><div class="order-head"><div><h3>${esc(order.customer_name)}</h3><p class="order-meta">${esc(order.created_at)} · ${esc(order.phone)} · ${esc(order.email)}<br>${esc(order.address)} · ${esc(order.cep)}</p></div><select class="status" data-id="${order.id}" aria-label="Status do pedido"><option ${order.status === 'pending' ? 'selected' : ''} value="pending">Pendente</option><option ${order.status === 'confirmed' ? 'selected' : ''} value="confirmed">Confirmado</option><option ${order.status === 'sent' ? 'selected' : ''} value="sent">Enviado</option><option ${order.status === 'cancelled' ? 'selected' : ''} value="cancelled">Cancelado</option></select></div><table><tbody>${order.items.map(item => `<tr><td>${item.quantity}x ${esc(item.name)} · ${esc(item.size)}</td><td>${esc(item.price)}</td></tr>`).join('')}</tbody></table><strong>Total: ${esc(order.total)}</strong>${order.proof_name ? `<br><a class="proof" href="/admin/api/orders/${order.id}/proof" target="_blank">Abrir comprovante (${esc(order.proof_name)}) ↗</a>` : ''}</article>`; }
    async function updateStatus(event) { try { await request(`/admin/api/orders/${event.target.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:event.target.value})}); loadOrders(); } catch (error) { alert(error.message); } }
    async function logout() { await fetch('/admin/logout',{method:'POST'}); renderLogin(); }
    function showTab(name) { document.querySelectorAll('.tab-panel').forEach(panel => { panel.hidden = panel.id !== `${name}Panel`; }); document.querySelectorAll('.tab-button').forEach(button => button.classList.toggle('active', button.dataset.tab === name)); }
    renderDashboard = function() { app.innerHTML = `<main class="dashboard"><header class="topbar"><div><p class="eyebrow">Painel privado</p><h1>Gestao da loja</h1></div><button class="logout" id="logout">Sair</button></header><nav class="tabs" aria-label="Abas administrativas"><button class="tab-button active" data-tab="orders" type="button">Pedidos</button><button class="tab-button" data-tab="finance" type="button">Financeiro</button><button class="tab-button" data-tab="customers" type="button">Cadastros</button><button class="tab-button" data-tab="products" type="button">Produtos</button></nav><section class="tab-panel" id="ordersPanel"><section class="stats"><div class="stat"><span class="label">Pedidos</span><strong id="totalOrders">-</strong></div><div class="stat"><span class="label">Pendentes</span><strong id="pendingOrders">-</strong></div><div class="stat"><span class="label">Recebidos</span><strong id="ordersNet">-</strong></div></section><h2>Ultimos pedidos</h2><div class="orders" id="orders"><p class="empty">Carregando pedidos...</p></div></section><section class="tab-panel" id="financePanel" hidden><div class="finance-grid"><div class="stat"><span class="label">Total bruto</span><strong id="grossRevenue">-</strong></div><div class="stat"><span class="label">Total liquido</span><strong id="netRevenue">-</strong></div></div><p class="finance-note">Bruto soma todos os pedidos. Liquido exclui pedidos cancelados; custos de produto, entrega e taxas ainda nao foram cadastrados.</p></section><section class="tab-panel" id="customersPanel" hidden><div class="panel-title"><div><h2>Cadastros</h2><p class="muted">Clientes agrupados por e-mail. Excluir remove os dados pessoais, preservando o historico financeiro.</p></div></div><div class="customers" id="customers"><p class="empty">Carregando cadastros...</p></div></section><section class="tab-panel" id="productsPanel" hidden><div class="panel-title"><div><h2>Catalogo de cafes</h2><p class="muted">Adicione, edite ou remova itens do cadastro.</p></div></div><form class="product-form" id="productForm"><label>Nome<input name="name" required></label><label>Tamanho<input name="size" placeholder="250g" required></label><label>Preco<input name="price" placeholder="R$ 29,90" required></label><label>Imagem<input class="product-image-input" name="image" placeholder="grao.jpeg"></label><button class="button" type="submit">Adicionar</button></form><div id="products"><p class="empty">Carregando produtos...</p></div></section></main>`; document.querySelector('#logout').addEventListener('click', logout); document.querySelectorAll('.tab-button').forEach(button => button.addEventListener('click', () => showTab(button.dataset.tab))); document.querySelector('#productForm').addEventListener('submit', addProduct); loadOrders(); loadProducts(); loadCustomers(); };
    loadOrders = async function() { try { const data = await request('/admin/api/orders'); document.querySelector('#totalOrders').textContent = data.stats.total; document.querySelector('#pendingOrders').textContent = data.stats.pending; document.querySelector('#ordersNet').textContent = money(data.stats.net); document.querySelector('#grossRevenue').textContent = money(data.stats.gross); document.querySelector('#netRevenue').textContent = money(data.stats.net); document.querySelector('#orders').innerHTML = data.orders.length ? data.orders.map(renderOrder).join('') : '<p class="empty">Ainda nao ha pedidos.</p>'; document.querySelectorAll('.status').forEach(select => select.addEventListener('change', updateStatus)); } catch (error) { if (error.message === 'AUTH_REQUIRED') renderLogin('Sua sessao expirou.'); else document.querySelector('#orders').innerHTML = `<p class="error">${esc(error.message)}</p>`; } };
    renderOrder = function(order) { return `<article class="order"><div class="order-head"><div><h3>${esc(order.customer_name)}</h3><p class="order-meta">${esc(order.created_at)} · ${esc(order.customer_phone)} · CPF: ${esc(order.customer_cpf || 'Nao informado')} · ${esc(order.customer_email)}<br>${esc(order.customer_address)} · ${esc(order.customer_cep)}</p></div><select class="status" data-id="${order.id}" aria-label="Status do pedido"><option ${order.status === 'pending' ? 'selected' : ''} value="pending">Pendente</option><option ${order.status === 'confirmed' ? 'selected' : ''} value="confirmed">Confirmado</option><option ${order.status === 'sent' ? 'selected' : ''} value="sent">Enviado</option><option ${order.status === 'cancelled' ? 'selected' : ''} value="cancelled">Cancelado</option></select></div><table><tbody>${order.items.map(item => `<tr><td>${item.quantity}x ${esc(item.name)} · ${esc(item.size)}</td><td>${esc(item.price)}</td></tr>`).join('')}</tbody></table><strong>Total: ${esc(order.total)}</strong>${order.proof_name ? `<br><a class="proof" href="/admin/api/orders/${order.id}/proof" target="_blank">Abrir comprovante (${esc(order.proof_name)}) ↗</a>` : ''}</article>`; };
    async function loadProducts() { try { const data = await request('/admin/api/products'); document.querySelector('#products').innerHTML = `<table class="product-table"><thead><tr><th>Nome</th><th>Tamanho</th><th>Preco</th><th>Imagem</th><th>Acoes</th></tr></thead><tbody>${data.products.map(product => `<tr data-id="${product.id}"><td><input data-field="name" value="${esc(product.name)}"></td><td><input data-field="size" value="${esc(product.size)}"></td><td><input data-field="price" value="${esc(product.price)}"></td><td><input class="product-image-input" data-field="image" value="${esc(product.image || '')}"></td><td class="product-actions"><button class="product-action product-save" type="button">Salvar</button><button class="product-action delete product-delete" type="button">Excluir</button></td></tr>`).join('')}</tbody></table>`; document.querySelectorAll('.product-save').forEach(button => button.addEventListener('click', saveProduct)); document.querySelectorAll('.product-delete').forEach(button => button.addEventListener('click', deleteProduct)); } catch (error) { document.querySelector('#products').innerHTML = `<p class="error">${esc(error.message)}</p>`; } }
    async function productPayload(row) { return Object.fromEntries([...row.querySelectorAll('[data-field]')].map(input => [input.dataset.field, input.value])); }
    async function saveProduct(event) { const row = event.target.closest('tr'); try { await request(`/admin/api/products/${row.dataset.id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(await productPayload(row)) }); loadProducts(); } catch (error) { alert(error.message); } }
    async function deleteProduct(event) { const row = event.target.closest('tr'); if (!confirm('Remover este produto?')) return; try { await request(`/admin/api/products/${row.dataset.id}`, { method:'DELETE' }); loadProducts(); } catch (error) { alert(error.message); } }
    async function addProduct(event) { event.preventDefault(); try { await request('/admin/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); event.currentTarget.reset(); loadProducts(); } catch (error) { alert(error.message); } }
    async function loadCustomers() { try { const data = await request('/admin/api/customers'); document.querySelector('#customers').innerHTML = data.customers.length ? data.customers.map(renderCustomer).join('') : '<p class="empty">Ainda nao ha cadastros.</p>'; document.querySelectorAll('.customer-delete').forEach(button => button.addEventListener('click', deleteCustomer)); } catch (error) { document.querySelector('#customers').innerHTML = `<p class="error">${esc(error.message)}</p>`; } }
    function renderCustomer(customer) { const address = [customer.residence_type, customer.address ? `${customer.address}, ${customer.address_number || 's/n'}` : '', customer.cep, customer.reference ? `Ref.: ${customer.reference}` : ''].filter(Boolean).join(' · '); return `<article class="customer-card"><div class="customer-card-head"><div><h3>${esc(customer.name)}</h3><p class="order-meta">${esc(customer.email || 'Cadastro sem e-mail')} · ${esc(customer.phone || 'Telefone nao informado')}<br>CPF: ${esc(customer.cpf || 'Nao informado')}<br>${esc(address || 'Endereco nao informado')}</p></div><button class="product-action delete customer-delete" data-email="${encodeURIComponent(customer.customer_email)}" type="button">Excluir cadastro</button></div><div class="customer-summary"><span><b>${customer.order_count}</b> pedido(s)</span><span>Ultimo pedido: ${esc(customer.last_order || '-')}</span></div></article>`; }
    async function deleteCustomer(event) { if (!confirm('Excluir os dados deste cadastro? O historico de pedidos sera preservado sem os dados pessoais.')) return; try { await request(`/admin/api/customers/${event.target.dataset.email}`, { method:'DELETE' }); loadCustomers(); } catch (error) { alert(error.message); } }
    fetch('/admin/api/me').then(response => response.ok ? renderDashboard() : renderLogin()).catch(() => renderLogin('Inicie o servidor para acessar o painel.'));
  </script>
</body>
</html>
